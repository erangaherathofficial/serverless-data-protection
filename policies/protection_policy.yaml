version: "1.0"
description: "Default protection policy for PII entities"

settings:
  default_protection: masking
  confidence_threshold: 0.7

rules:
  - entity_type: EMAIL_ADDRESS
    protection_method: sha256_hash
    priority: 1
    description: "Hash email addresses for pseudonymization"

  - entity_type: PHONE_NUMBER
    protection_method: masking
    priority: 2
    options:
      mask_char: "*"
      visible_chars: 4
      direction: right
    description: "Mask phone numbers keeping last 4 digits"

  - entity_type: CREDIT_CARD
    protection_method: aes256_encrypt
    priority: 1
    description: "Encrypt credit card numbers with AES-256"

  - entity_type: UK_NHS
    protection_method: tokenization
    priority: 1
    description: "Tokenize UK NHS numbers"

  - entity_type: PERSON
    protection_method: masking
    priority: 3
    options:
      mask_char: "X"
      visible_chars: 1
      direction: left
    description: "Mask person names keeping first initial"

  - entity_type: LOCATION
    protection_method: masking
    priority: 4
    options:
      mask_char: "*"
      visible_chars: 0
    description: "Fully mask location data"

  - entity_type: DATE_TIME
    protection_method: masking
    priority: 5
    options:
      mask_char: "*"
      visible_chars: 4
      direction: left
    description: "Mask dates keeping year"

  - entity_type: IP_ADDRESS
    protection_method: sha256_hash
    priority: 2
    description: "Hash IP addresses"

  - entity_type: IBAN_CODE
    protection_method: aes256_encrypt
    priority: 1
    description: "Encrypt IBAN codes"

  - entity_type: UK_NINO
    protection_method: sha256_hash
    priority: 1
    description: "Hash UK National Insurance numbers"

  - entity_type: UK_POSTCODE
    protection_method: masking
    priority: 2
    options:
      mask_char: "*"
      visible_chars: 3
      direction: left
    description: "Mask UK postcodes keeping outward area"

  - entity_type: UK_CITY
    protection_method: masking
    priority: 2
    options:
      mask_char: "*"
      visible_chars: 0
    description: "Fully mask UK city names embedded in addresses"

  - entity_type: UK_NAME
    protection_method: masking
    priority: 2
    options:
      mask_char: "X"
      visible_chars: 1
      direction: left
    description: "Dictionary fallback for UK names — masks first/last names"

  - entity_type: UK_PHONE
    protection_method: masking
    priority: 2
    options:
      mask_char: "*"
      visible_chars: 4
      direction: right
    description: "Mask UK phone numbers keeping last 4 digits"

  - entity_type: UK_DRIVERS_LICENSE
    protection_method: tokenization
    priority: 1
    description: "Tokenize UK driving licence numbers"

  - entity_type: UK_PASSPORT
    protection_method: tokenization
    priority: 1
    description: "Tokenize UK passport numbers"

  - entity_type: UK_BANK_ACCOUNT
    protection_method: aes256_encrypt
    priority: 1
    description: "Encrypt UK bank account / sort code"

  - entity_type: UK_VRN
    protection_method: masking
    priority: 2
    options:
      mask_char: "*"
      visible_chars: 0
    description: "Fully mask vehicle registration numbers"
